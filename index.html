<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>인생 역전! 로또 1등 당첨 기원</title>
    <!-- 구글 애드센스 스크립트 (광고 차단 방지 및 로드) -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
        crossorigin="anonymous"></script>
    <style>
        /* 
         * [스타일 정의]
         * 전체적인 분위기는 어둡고 신비로우며, '행운'을 상징하는 금빛과 네온 효과를 사용합니다.
         */

        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');

        :root {
            --bg-color-start: #1a0b2e;
            --bg-color-end: #4a192c;
            --neon-gold: #ffd700;
            --neon-glow: 0 0 10px #ffd700, 0 0 20px #ffd700, 0 0 30px #ff00de;

            /* 로또 공 색상 변수 (대한민국 로또 표준 색상) */
            --ball-yellow: #fbc400;
            /* 1-10 */
            --ball-blue: #69c8f2;
            /* 11-20 */
            --ball-red: #ff7272;
            /* 21-30 */
            --ball-gray: #aaaaaa;
            /* 31-40 */
            --ball-green: #b0d840;
            /* 41-45 */
        }

        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, var(--bg-color-start), var(--bg-color-end));
            min-height: 100vh;
            color: white;
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* 메인 컨테이너: 반투명 배경으로 콘텐츠 강조 */
        .container {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            margin: 2rem;
            width: 90%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            position: absolute;
            z-index: 10;
            overflow: hidden;
        }

        /* 제목 스타일: 깜빡이는 애니메이션 적용 */
        h1 {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 900;
            /* Extra Bold */
            font-size: 3rem;
            color: var(--neon-gold);
            text-shadow: var(--neon-glow);
            margin-bottom: 0.5rem;
            animation: pulse 2s infinite ease-in-out;
            letter-spacing: -1px;
        }

        .neon-gold {
            color: var(--neon-gold);
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.9;
            }
        }

        p.comment {
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            font-size: 1.5rem;
            color: #ffffff;
            /* 가독성 위해 흰색으로 변경 */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 2rem;
        }

        /* 구글 애드센스 영역 */
        .ad-container {
            width: 100%;
            height: auto;
            min-height: 100px;
            background: rgba(255, 255, 255, 0.05);
            margin: 1rem 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            overflow: hidden;
        }

        /* 로또 공들이 들어갈 영역 */
        .result-area {
            display: flex;
            justify-content: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            margin: 3rem 0;
            min-height: 66px;
            /* 공이 없을 때도 공간 유지 */
            padding-left: 10%;
        }

        /* 기본 로또 공 디자인 */
        .ball {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            /* 기본 배경은 JS로 숫자 범위에 따라 설정 */

            /* 텍스트 색상을 흰색으로 변경하여 어두운 공 바탕에 대비 */
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            /* 두껍게 */
            font-size: 2rem;
            font-family: 'Noto Sans KR', sans-serif;

            /* 공의 구체적인 느낌과 윤곽 강조 */
            box-shadow:
                /* 내부 그림자로 구체감 추가 */
                inset 0 0 10px rgba(0, 0, 0, 0.7),
                /* 외부 그림자로 바닥에 닿는 느낌 추가 */
                5px 5px 15px rgba(0, 0, 0, 0.7);

            position: relative;
            transform: scale(0);
            text-shadow:
                /* 텍스트에 흰색 테두리 또는 그림자를 줘서 시인성 향상 */
                -1px -1px 0 #333,
                1px -1px 0 #333,
                -1px 1px 0 #333,
                1px 1px 0 #333;
            /* 추가: 이미지 속 공처럼 패턴을 넣으려면 복잡한 CSS 그라데이션이나 SVG 패턴이 필요합니다. */
        }

        /* 공 색상별 클래스 */
        .color-yellow {
            background: radial-gradient(circle at 30% 30%, #ffee58 0%, #fbc02d 50%, #f9a825 100%);
        }

        .color-blue {
            background: radial-gradient(circle at 30% 30%, #4fc3f7 0%, #03a9f4 50%, #0288d1 100%);
        }

        .color-red {
            background: radial-gradient(circle at 30% 30%, #ef5350 0%, #d32f2f 50%, #c62828 100%);
        }

        .color-gray {
            background: radial-gradient(circle at 30% 30%, #e0e0e0 0%, #9e9e9e 50%, #616161 100%);
        }

        .color-green {
            background: radial-gradient(circle at 30% 30%, #aed581 0%, #689f38 50%, #558b2f 100%);
        }

        /* 보너스 볼 스타일 (다른 테두리, 약간의 빛나는 효과) */
        .bonus-ball {
            /* border: 4px solid #fff; */
            box-shadow: 0 0 15px #fff, inset -5px -5px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        /* 보너스 볼 라벨 표시 */
        /* .bonus-ball::after {
            content: '보너스';
            position: absolute;
            bottom: -25px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            width: 60px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        } */

        .plus-sign {
            display: flex;
            align-items: center;
            font-size: 2rem;
            color: white;
            font-weight: bold;
            transform: scale(0);
            /* 등장 전 숨김 */
        }

        /* 추첨 버튼 */
        .draw-btn {
            background: linear-gradient(45deg, #ff0099, #493240);
            border: none;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Noto Sans KR', sans-serif;
            font-weight: 700;
            box-shadow: 0 5px 15px rgba(255, 0, 153, 0.4);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .draw-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 0, 153, 0.6);
        }

        .draw-btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .draw-btn:disabled {
            background: #555;
            cursor: not-allowed;
            box-shadow: none;
            opacity: 0.7;
        }

        /* 등장 애니메이션 (Rolling In) */
        @keyframes rollIn {
            0% {
                transform: translateX(100vw) rotate(1440deg);
                opacity: 0;
            }

            98% {
                transform: translateX(-0.2vw) rotate(-10deg);
                opacity: 1;
            }

            100% {
                transform: translateX(0) rotate(0deg);
                opacity: 1;
            }
        }

        /* 
         * 정렬 시 사용할 전환 효과 
         * 공의 내용(색상, 숫자)이 바뀔 때 부드럽게 처리하기 위함
         */
        .ball {
            /* 기존 스타일 유지 */
            width: 60px;
            height: 60px;
            border-radius: 50%;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 2rem;
            font-family: 'Noto Sans KR', sans-serif;
            box-shadow: inset -5px -5px 15px rgba(0, 0, 0, 0.3), 3px 3px 10px rgba(0, 0, 0, 0.5);
            position: relative;
            /* transform: scale(0); 제거 -> rollIn에서 처리 */
            text-shadow: none;
            transition: transform 0.5s ease, background-color 0.5s ease, border-color 0.5s ease, color 0.5s ease;
        }

        /* 정렬 중일 때 잠시 숨김/축소 효과 */
        .ball.sorting {
            transform: scale(0.1) rotate(-180deg);
            opacity: 0.5;
        }

        /* 떨림 효과 (Jiggle) */
        @keyframes jiggle {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(2px, 2px);
            }

            50% {
                transform: translate(-2px, -2px);
            }

            75% {
                transform: translate(2px, -2px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        .jiggle {
            animation: jiggle 0.2s infinite;
        }

        /* 폭죽 캔버스 (전체 화면 덮기) */
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            /* 클릭 통과 */
            z-index: 5;
        }

        /* 반응형 디자인 */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }

            .ball {
                width: 45px;
                height: 45px;
                font-size: 1.2rem;
            }

            .container {
                padding: 1rem;
                margin: 1rem;
                width: 95%;
            }

            .result-area {
                padding-left: 0;
                min-height: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- 폭죽 효과를 위한 캔버스 -->
    <canvas id="fireworks"></canvas>

    <div class="container">
        <h1>✨ 인생 역전 로또 ✨</h1>

        <!-- 구글 애드센스 광고 단위 -->
        <div class="ad-container">
            <script async
                src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3737135009848849"

            <!-- LOTTO-TOP -->

            </script>
        </div>

        <p class="comment">
            주인공은 바로 당신입니다.<br>
            <span class="neon-gold">황금빛</span> 행운이 쏟아집니다!
        </p>

        <div class="result-area" id="resultArea">
            <!-- 로또 공들이 여기에 생성됩니다 -->
        </div>

        <button class="draw-btn" id="drawBtn">운명의 번호 추첨하기</button>

        <div class="congrats-msg" id="congratsMsg">🎉 1등 당첨을 진심으로 기원합니다! 🎉</div>
    </div>

    <script>
        /**
         * [로또 번호 생성 및 애니메이션 로직]
         * 1. 1~45 사이 중복 없는 숫자 7개 생성 (6개 일반 + 1개 보너스)
         * 2. 각 공을 순차적으로 화면에 표시
         * 3. 표시 전 떨림/롤링 효과 적용
         * 4. 마무리로 폭죽 효과 실행
         */

        const drawBtn = document.getElementById('drawBtn');
        const resultArea = document.getElementById('resultArea');
        const congratsMsg = document.getElementById('congratsMsg');
        const canvas = document.getElementById("fireworks");
        const ctx = canvas.getContext("2d");

        // 캔버스 크기 조절
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * 로또 번호 생성 함수
         * @returns {Array} [무작위 순서의 6개 번호 배열, 보너스 번호] - 정렬하지 않고 반환
         */
        function generateLottoNumbers() {
            const numbers = new Set();
            while (numbers.size < 7) {
                numbers.add(Math.floor(Math.random() * 45) + 1);
            }
            const arr = Array.from(numbers);
            const bonus = arr.pop(); // 마지막 하나를 보너스로
            // arr.sort((a, b) => a - b); // 정렬하지 않음 (리얼함을 위해)
            return [arr, bonus];
        }

        /**
         * 숫자 범위에 따른 색상 클래스 반환
         */
        function getColorClass(num) {
            if (num <= 10) return 'color-yellow';
            if (num <= 20) return 'color-blue';
            if (num <= 30) return 'color-red';
            if (num <= 40) return 'color-gray';
            return 'color-green';
        }

        /**
         * 공 생성 및 등장을 처리하는 함수
         * - 숫자가 확정된 상태로 굴러들어옴
         */
        function createBall(number, isBonus = false, delay) {
            return new Promise((resolve) => {
                setTimeout(() => {
                    const ball = document.createElement('div');
                    // 초기 색상은 확정 번호에 맞춰 설정
                    ball.className = `ball ${getColorClass(number)}`;
                    if (isBonus) ball.classList.add('bonus-ball');

                    ball.innerText = number;
                    // 굴러오는 애니메이션 적용
                    const duration = window.innerWidth / 1000 * 2;
                    ball.style.animation = `rollIn ${duration}s linear forwards`;

                    resultArea.appendChild(ball);

                    resolve();
                }, delay);
            });
        }

        /**
         * 공들을 번호순으로 정렬하는 함수
         * - 시각적 효과(수축 -> 데이터 변경 -> 팽창)를 사용
         */
        function sortBalls(mainNumbers, delay) {
            return new Promise((resolve) => {
                const balls = document.querySelectorAll('.ball:not(.bonus-ball)');
                const sortedNumbers = [...mainNumbers].sort((a, b) => a - b);

                // 1. 수축 효과 (잠시 숨김)
                balls.forEach(ball => ball.classList.add('sorting'));

                setTimeout(() => {
                    // 2. 데이터 및 색상 변경
                    balls.forEach((ball, index) => {
                        const newNum = sortedNumbers[index];
                        ball.innerText = newNum;

                        // 기존 색상 클래스 제거 및 새 클래스 추가
                        ball.className = 'ball ' + getColorClass(newNum);
                        // sorting 클래스 유지를 위해 다시 추가 (위에서 덮어씌워졌으므로)
                        ball.classList.add('sorting');
                    });

                    // 3. 팽창 효과 (다시 보임)
                    // 약간의 텀을 두고 클래스 제거하여 transition 발동
                    requestAnimationFrame(() => {
                        balls.forEach(ball => ball.classList.remove('sorting'));
                    });

                    resolve();
                }, delay);
            });
        }

        /**
         * 추첨 시작 함수 (메인 로직)
         */
        async function startDraw() {
            // 초기화
            drawBtn.disabled = true;
            drawBtn.innerText = "추첨 진행 중...";
            resultArea.innerHTML = '';
            congratsMsg.classList.remove('show');
            ctx.clearRect(0, 0, canvas.width, canvas.height); // 폭죽 초기화

            const [mainNumbers, bonusNumber] = generateLottoNumbers();

            // 일반 공 6개 순차 등장 (랜덤 순서)
            const stepDelay = 600;

            for (let i = 0; i < mainNumbers.length; i++) {
                await createBall(mainNumbers[i], false, stepDelay);
            }

            // 플러스 기호 등장
            setTimeout(() => {
                const plus = document.createElement('div');
                plus.className = 'plus-sign';
                plus.innerText = '+';
                plus.style.animation = 'appear 0.5s forwards';
                // appear는 기존에 있던 애니메이션인데 삭제했으므로 rollIn으로 대체하거나 복구 필요.
                // 여기서는 간단히 opacity fadein 등으로 처리하거나 rollIn 사용. 
                // plus-sign은 작으므로 rollIn은 과함. scale up만 복구하거나 style로 처리.
                plus.style.animation = 'none';
                plus.style.transform = 'scale(0)';
                plus.style.transition = 'transform 0.5s';
                requestAnimationFrame(() => plus.style.transform = 'scale(1)');

                resultArea.appendChild(plus);
            }, stepDelay + (window.innerWidth * 2));

            // 보너스 공 등장
            await createBall(bonusNumber, true, stepDelay + (window.innerWidth * 2));

            // 잠시 대기 후 정렬
            await new Promise(r => setTimeout(r, 2000));
            sortBalls(mainNumbers, 500);

            // 마무리
            setTimeout(() => {
                drawBtn.disabled = false;
                drawBtn.innerText = "다시 추첨하기";
                congratsMsg.classList.add('show');
                launchFireworks(); // 폭죽 발사
            }, 500);
        }

        drawBtn.addEventListener('click', startDraw);

        /**
         * [폭죽 애니메이션 로직]
         * 간단한 파티클 시스템 구현
         */
        const particles = [];

        function createParticle(x, y) {
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 100, // 수명
                    color: `hsl(${Math.random() * 360}, 100%, 50%)`
                });
            }
        }

        // 기존 코드:
        // if (particles.length > 0) {
        //     requestAnimationFrame(updateParticles);
        // }

        // 아래 코드로 수정:
        function updateParticles() {
            // Canvas를 약간 투명하게 지워 잔상 효과를 만듭니다 (선택 사항)
            ctx.fillStyle = 'rgba(26, 11, 46, 0.1)'; // 배경색에 가까운 투명 색상
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < particles.length; i++) {
                // ... (파티클 업데이트 로직은 그대로) ...
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.1; // 중력
                p.life--;

                // 투명도(opacity)를 수명에 따라 조절
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.life / 100; // life가 줄어들수록 투명해짐

                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1; // 다른 요소에 영향을 주지 않도록 알파값 복원

                if (p.life <= 0) {
                    particles.splice(i, 1);
                    i--;
                }
            }

            // ⭐ 핵심 수정: 파티클이 남아 있으면 다음 프레임을 예약
            if (particles.length > 0) {
                requestAnimationFrame(updateParticles);
            }
            // 파티클이 모두 사라지면 캔버스를 완전히 지움
            else {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }

        function launchFireworks() {
            // 화면 랜덤 위치에 여러 번 폭죽 생성
            let count = 0;
            const interval = setInterval(() => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * (canvas.height / 2); // 상단 절반에서 터지도록
                createParticle(x, y);
                count++;
                if (count > 5) clearInterval(interval);

                // ⭐ 중요: 파티클이 남아 있을 때만 updateParticles를 호출해야 재귀 호출이 과도하게 되지 않습니다.
                // 첫 번째 폭죽이 터질 때만 루프를 시작합니다.
                if (count === 1) {
                    requestAnimationFrame(updateParticles);
                }

            }, 300);

            // 여기 requestAnimationFrame(updateParticles)는 제거합니다.
        }

    </script>
</body>
